  function rr(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function hexPath(ctx,cx,cy,r){
    ctx.beginPath();
    for(var i=0;i<6;i++){
      var a=Math.PI/180*(60*i-90), px=cx+r*Math.cos(a), py=cy+r*Math.sin(a);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }
  function wrapText(ctx,text,maxW){
    var CLOSE='，。、；：！？）】》」』,.';
    var lines=[],line='';
    for(var i=0;i<text.length;i++){
      var ch=text[i], t=line+ch;
      // 行首标点（，。等）不许换行：紧贴上一行
      if(ctx.measureText(t).width>maxW && line && CLOSE.indexOf(ch)<0){ lines.push(line); line=ch; }
      else line=t;
    }
    if(line) lines.push(line);
    return lines;
  }
  function fitFont(ctx,text,maxW,maxSize,minSize,weight,family){
    var size=maxSize;
    while(size>minSize){ ctx.font=weight+' '+size+'px '+family; if(ctx.measureText(text).width<=maxW) break; size-=2; }
    return size;
  }

      ctx.fillText(s[0],x+24,yy+44);
      ctx.fillStyle='#5a4c3e'; ctx.font='400 25px '+SANS; ctx.letterSpacing='0px';
      wrapText(ctx,s[1],w-48).slice(0,2).forEach(function(l,i2){ ctx.fillText(l,x+24,yy+84+i2*32); });
    });
    ctx.letterSpacing='0px';
  }
  function drawCap(ctx,big,small){
    faceBase(ctx);
    ctx.strokeStyle=C.teal; ctx.lineWidth=4;
    hexPath(ctx,512,512,300); ctx.stroke();
    ctx.fillStyle='rgba(169,200,187,.18)';
    hexPath(ctx,512,512,300); ctx.fill();
    ctx.strokeStyle=C.teal; ctx.lineWidth=3;
    hexPath(ctx,512,512,240); ctx.stroke();
    ctx.fillStyle=C.teal; ctx.font='700 64px '+SERIF; ctx.textAlign='center';
    ctx.fillText(big,512,496);
    ctx.fillStyle=C.sub; ctx.font='400 26px '+SANS; ctx.letterSpacing='6px';
    ctx.fillText(small,512,566);
    ctx.textAlign='left'; ctx.letterSpacing='0px';
  }

  /* ==================== 详情卡构建 ==================== */
  function buildDetail(f){
    var html='<div class="card"><div class="card-head"><h3>'+f.name+'</h3>'+
      '<span class="tag">'+f.label+'</span><button class="d-close" aria-label="关闭">✕</button></div>'+
      '<div class="d-body">';
    f.detail.forEach(function(blk){
      if(blk[0]==='h4') html+='<h4>'+blk[1]+'</h4>';
      else if(blk[0]==='p') html+='<p>'+blk[1]+'</p>';
      else if(blk[0]==='row') html+='<p class="d-row"><b>'+blk[1][0]+'</b><span>'+blk[1][1]+'</span></p>';
      else if(blk[0]==='ul') html+='<ul>'+blk[1].map(function(li){return '<li>'+li+'</li>';}).join('')+'</ul>';
    });
    html+='</div></div>';
    return html;
  }

  /* ==================== Three.js 场景 ==================== */
  var canvas=document.getElementById('gl');
  var renderer=new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(0x000000,0);

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
  function defaultCamZ(){ return window.innerWidth/window.innerHeight<0.7 ? 6.6 : 5.4; }
  var CAM_FAR=defaultCamZ(), CAM_NEAR=3.4;
  var camZ=CAM_FAR;
  camera.position.set(0,0,camZ);
  camera.lookAt(0,0,0);

  var SIZE=2.5, HALF=SIZE/2;
  var cube=new THREE.Group();
  cube.rotation.order='YXZ';
  cube.rotation.set(0,0,0);          // 初始正视（无倾斜）
  scene.add(cube);

  function makeTexture(canvas){
    var t=new THREE.CanvasTexture(canvas);
    t.generateMipmaps=true;                 // 开启 mipmap：消除旋转/远处时的摩尔纹与闪烁
    t.minFilter=THREE.LinearMipmapLinearFilter;
    t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),16);
    return t;
  }
  function makeFaceMesh(canvasTex){
    var geo=new THREE.PlaneGeometry(SIZE,SIZE);
    var mat=new THREE.MeshBasicMaterial({map:canvasTex, side:THREE.DoubleSide, transparent:true});
    return new THREE.Mesh(geo,mat);
  }

  var faces={};
  FACES.forEach(function(f){
    var mesh=makeFaceMesh(null);
    mesh.userData.faceId=f.id;
    faces[f.id]=mesh;
    cube.add(mesh);
  });
  function buildFaceTextures(){
    FACES.forEach(function(f){
      var lf=localizeFace(f);
      var ctx=makeCanvas().getContext('2d');
      if(lf.type==='front') drawFront(ctx,lf);
      else if(lf.type==='project') drawProject(ctx,lf);
      else drawAbout(ctx,lf);
      var mesh=faces[f.id];
      var old=mesh.material.map;
      mesh.material.map=makeTexture(ctx.canvas);
      mesh.material.needsUpdate=true;
      if(old) old.dispose();
    });
  }
  // 顶底装饰盖（保留引用，用于射线遮挡：点击顶底时不再穿透命中背面）
  var capTopCtx=makeCanvas().getContext('2d'); drawCap(capTopCtx,'2026','RESUME');
  var capBottomCtx=makeCanvas().getContext('2d'); drawCap(capBottomCtx,'LIU','YUAN NING');
  function capMesh(tex,rotX,posY){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(SIZE,SIZE),
      new THREE.MeshBasicMaterial({map:makeTexture(tex.canvas), side:THREE.DoubleSide, transparent:true}));
    m.rotation.x=rotX; m.position.y=posY;
    return m;
  }
  var capTop=capMesh(capTopCtx,Math.PI/2,HALF);
  var capBottom=capMesh(capBottomCtx,-Math.PI/2,-HALF);
  cube.add(capTop); cube.add(capBottom);
  // 面定位
  faces.front.position.set(0,0,HALF);
  faces.back.rotation.y=Math.PI; faces.back.position.set(0,0,-HALF);
  faces.right.rotation.y=Math.PI/2; faces.right.position.set(HALF,0,0);
  faces.left.rotation.y=-Math.PI/2; faces.left.position.set(-HALF,0,0);
  buildFaceTextures();

  /* ==================== 背景粒子（鼠标可扰动） ==================== */
  var spriteTex=(function(){
    var c=document.createElement('canvas'); c.width=64; c.height=64;
    var x=c.getContext('2d');
    var g=x.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  })();
  function makeParticles(count,zMin,zMax,size,opacity){
    var pos=new Float32Array(count*3), col=new Float32Array(count*3), home=[];
    var palette=['#E08A54','#F3CDB4','#A9C8BB','#5F9482','#EFC0A6','#D9C9B4'];
    for(var i=0;i<count;i++){
      var a=Math.random()*Math.PI*2, r=1.2+Math.random()*3.2;
      var x=Math.cos(a)*r, y=(Math.random()-0.5)*4.2, z=zMin+Math.random()*(zMax-zMin);
      pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z; home.push(x,y,z);
      var pc=new THREE.Color(palette[i%palette.length]);
      col[i*3]=pc.r; col[i*3+1]=pc.g; col[i*3+2]=pc.b;
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    var mat=new THREE.PointsMaterial({size:size, map:spriteTex, transparent:true,
      opacity:opacity, vertexColors:true, depthWrite:false, sizeAttenuation:true});
    var pts=new THREE.Points(geo,mat);
    scene.add(pts);
    return {pts:pts, home:home, count:count, pos:pos, vel:new Float32Array(count*3)};
  }
  var farP=makeParticles(90,-5.5,1,0.045,0.32);
  var nearP=makeParticles(55,1.5,5,0.075,0.55);

  /* ==================== 交互状态 ==================== */
  var yaw=0, pitch=0, camZ=CAM_FAR;
  var dragging=false, moved=false, tourRunning=false, expanded=null;
  var lastX=0, startX=0, startY=0;
  var mouseNDC=new THREE.Vector2(0,0), mouseScreen={x:-9999,y:-9999};
  var raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
  var hovered=null, lastInteract=performance.now();

  var nrm=function(r){ r=r%(Math.PI*2); if(r<0)r+=Math.PI*2; return r; };
  var faceOf=function(){ var idx=Math.round(nrm(yaw)/(Math.PI/2))%4; return ORDER[idx]; };
  function applyRotation(){ cube.rotation.y=yaw; cube.rotation.x=pitch; }

  /* 缓动引擎 */
  var tweens=[];
  function animate(get,set,to,dur,ease,cb){
    var from=get(), t0=performance.now(), t={running:true};
    t.step=function(now){
      var k=Math.min(1,(now-t0)/dur);
      set(from+(to-from)*ease(k));
      if(k>=1){ t.running=false; if(cb)cb(); }
    };
    tweens.push(t); return t;
  }
  function easeInOutCubic(k){ return k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2; }
  function easeOutCubic(k){ return 1-Math.pow(1-k,3); }
  function easeOutBack(k){ var c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(k-1,3) + c1*Math.pow(k-1,2); }
  function shortestDelta(to){ var d=nrm(to)-nrm(yaw); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
  var yawTween=null;
  function yawAnimate(to,dur,ease,cb){
    if(yawTween) yawTween.running=false;
    yawTween=animate(function(){return yaw;},function(v){yaw=v;applyRotation();},yaw+shortestDelta(to),dur,ease,cb);
    return yawTween;
  }
  function tweenYawTo(to,dur,cb){ return yawAnimate(to,dur,easeOutCubic,cb); }   // 拖拽吸附：平滑
  function twistYawTo(to,dur,cb){ return yawAnimate(to,dur,easeOutBack,cb); }    // 按钮/点击：魔方拧动
  function navToFace(id){
    if(tourRunning) return;
    if(!FACE_YAW.hasOwnProperty(id)) return;
    if(expanded) closeDetail();
    updateHud(id);
    twistYawTo(FACE_YAW[id],430);
  }
  function tweenCamZ(to,dur,cb){ animate(function(){return camZ;},function(v){camZ=v;camera.position.z=v;},to,dur,easeOutCubic,cb); }

  function snap(){
    var target=Math.round(nrm(yaw)/(Math.PI/2))*(Math.PI/2);
    if(target>=Math.PI*2) target=0;
    tweenYawTo(target,500);
    if(pitch>0.175||pitch<-0.175){
      animate(function(){return pitch;},function(v){pitch=v;applyRotation();},
        Math.max(-0.175,Math.min(0.175,pitch)),360,easeOutCubic);
    }
    updateHud(ORDER[Math.round(nrm(target)/(Math.PI/2))%4]);
  }

  /* ==================== 详情开合 ==================== */
  var detailEl=document.getElementById('detail');
  function openFace(id){
    if(tourRunning) return;
    if(!FACE_YAW.hasOwnProperty(id)) return;
    if(expanded===id){ closeDetail(); return; }
    if(expanded) closeDetail();
    updateHud(id);
    twistYawTo(FACE_YAW[id],380,function(){
      expanded=id;
      detailEl.innerHTML=buildDetail(localizeFace(FACES.filter(function(f){return f.id===id;})[0]));
      detailEl.classList.add('show');
      tweenCamZ(CAM_NEAR,560);
    });
  }
  function closeDetail(){
    if(!expanded) return;
    detailEl.classList.remove('show');
    expanded=null;
    tweenCamZ(defaultCamZ(),520);
    updateHud();
  }
  detailEl.addEventListener('click',function(e){
    if(e.target.closest('.d-close')) closeDetail();
  });

  /* ==================== 指针交互 ==================== */
  var glEl=canvas;
  var outsideTap=false;
  glEl.addEventListener('pointerdown',function(e){
    if(tourRunning) return;
    if(expanded){ outsideTap=true; return; }
    dragging=true; moved=false;
    startX=lastX=e.clientX; startY=e.clientY;
    glEl.classList.add('grabbing'); glEl.classList.remove('hovering');
    try{ glEl.setPointerCapture(e.pointerId); }catch(err){}
    lastInteract=performance.now();
  });
  glEl.addEventListener('pointermove',function(e){
    mouseScreen.x=e.clientX; mouseScreen.y=e.clientY;
    mouseNDC.x=(e.clientX/window.innerWidth)*2-1;
    mouseNDC.y=-(e.clientY/window.innerHeight)*2+1;
    var glow=document.getElementById('glow');
    glow.style.left=e.clientX+'px'; glow.style.top=e.clientY+'px';
    if(dragging){
      var dx=e.clientX-lastX; lastX=e.clientX;
      if(Math.abs(e.clientX-startX)>5||Math.abs(e.clientY-startY)>5) moved=true;
      yaw-=dx*0.0085;
      pitch-= (e.clientY-startY)*0.004;
      pitch=Math.max(-0.175,Math.min(0.175,pitch));
      applyRotation(); lastInteract=performance.now();
    } else {
      pick(e);
    }
  });
  glEl.addEventListener('pointerleave',function(){ mouseScreen.x=-9999; mouseScreen.y=-9999; });
  function onUp(e){
    if(outsideTap){ outsideTap=false; if(!moved) closeDetail(); return; }
    if(!dragging) return;
    dragging=false;
    glEl.classList.remove('grabbing');
    if(!moved){
      var hit=pick(e,true);
      if(hit) openFace(hit.userData.faceId);
      else if(expanded) closeDetail();
      else updateHud();
    } else {
      snap();
    }
  }
  glEl.addEventListener('pointerup',onUp);
  glEl.addEventListener('pointercancel',onUp);
  glEl.addEventListener('wheel',function(e){
    e.preventDefault();
    if(tourRunning||expanded) return;
    var target=Math.max(3.2,Math.min(9,camZ+e.deltaY*0.004));
    tweenCamZ(target,300); lastInteract=performance.now();
  },{passive:false});
  document.addEventListener('mousemove',function(){ document.body.classList.add('has-pointer'); },{once:true});

  function pick(e,force){
    ndc.x=(e.clientX/window.innerWidth)*2-1;
    ndc.y=-(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(ndc,camera);
    var hits=raycaster.intersectObjects([faces.front,faces.back,faces.right,faces.left,capTop,capBottom],false);
    var faceObj=null;
    for(var i=0;i<hits.length;i++){ if(hits[i].object.userData.faceId){ faceObj=hits[i].object; break; } }
    if(force) return faceObj;
    var id=faceObj?faceObj.userData.faceId:null;
    if(id!==hovered){
      if(hovered) faces[hovered].material.color.set('#ffffff');
      hovered=id;
      if(hovered){ faces[hovered].material.color.set('#f1e3cf'); glEl.classList.add('hovering'); }
      else glEl.classList.remove('hovering');
    }
    return null;
  }

  /* ==================== HUD / 键盘 ==================== */
  var chips=Array.prototype.slice.call(document.querySelectorAll('.hud-chip[data-face]'));
  function updateHud(face){
    var f=face||faceOf();
    chips.forEach(function(c){ c.classList.toggle('active',c.dataset.face===f); });
  }
  function applyUI(){
    var u=UI[LANG], names=['front','right','back','left'];
    chips.forEach(function(c){
      var idx=names.indexOf(c.dataset.face);
      c.innerHTML='<span class="dot"></span>'+u.hud[idx];
    });
    document.getElementById('btn-reset').title=u.resetTitle;
    var pdf=document.getElementById('btn-pdf');
    pdf.textContent=u.pdf; pdf.title=u.pdfTitle;
    document.getElementById('hint').innerHTML=u.hint;
    document.getElementById('key-hint').innerHTML=u.keyHint;
    document.getElementById('l-sub').textContent=u.loaderSub;
    document.getElementById('btn-lang').textContent=u.langBtn;
  }
  document.getElementById('btn-lang').addEventListener('click',function(){
    LANG=(LANG==='zh')?'en':'zh';
    buildFaceTextures();
    applyUI();
    if(expanded){
      var f=FACES.filter(function(x){return x.id===expanded;})[0];
      detailEl.innerHTML=buildDetail(localizeFace(f));
    }
    updateHud();
  });
  chips.forEach(function(c){
    c.addEventListener('click',function(){ navToFace(c.dataset.face); });
  });
  document.getElementById('btn-reset').addEventListener('click',function(){
    if(tourRunning) return;
    if(expanded) closeDetail();
    updateHud('front');
    twistYawTo(0,430);
    animate(function(){return pitch;},function(v){pitch=v;applyRotation();},0,360,easeOutCubic);
  });
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeDetail(); return; }
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      var cur=faceOf(), i=NARR.indexOf(cur), dir=e.key==='ArrowRight'?1:-1;
      var next=NARR[(i+dir+NARR.length)%NARR.length];
      navToFace(next);
    }
  });

  /* ==================== 开场导览：一圈约 2 秒 ==================== */
  function runTour(){
    tourRunning=true;
    document.getElementById('hint').innerHTML=UI[LANG].tour;
    var startYaw=yaw;
    animate(function(){return yaw;},function(v){ yaw=v; applyRotation(); updateHud(); },
      startYaw-2*Math.PI, 2100, easeInOutCubic, function(){
        tourRunning=false; yaw=0; applyRotation();
        document.getElementById('hint').innerHTML=UI[LANG].hint;
        updateHud();
      });
    updateHud();
  }

  /* ==================== 渲染循环 ==================== */
  function updateParticles(layer,dt){
    var pos=layer.pos, home=layer.home, vel=layer.vel, n=layer.count;
    var mw=null;
    if(mouseScreen.x>-9000){
      var v=new THREE.Vector3(mouseNDC.x,mouseNDC.y,0.5).unproject(camera);
      if(Math.abs(v.z)>0.0001){
        var t=-camera.position.z/v.z;
        mw=new THREE.Vector3(v.x*t,v.y*t,0);   // z=0 平面上的鼠标世界坐标
      }
    }
    for(var i=0;i<n;i++){
      var ix=i*3, hx=home[ix], hy=home[ix+1], hz=home[ix+2];
      var px=pos[ix], py=pos[ix+1];
      var ox=px-hx, oy=py-hy;
      if(mw){
        var dx=px-mw.x, dy=py-mw.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<0.55&&d>0.001){
          var f=(1-d/0.55)*0.35;
          vel[ix]+=(dx/d)*f*dt*10; vel[ix+1]+=(dy/d)*f*dt*10;
        }
      }
      vel[ix]+=-ox*0.35*dt*10; vel[ix+1]+=-oy*0.35*dt*10;
      vel[ix]*=0.94; vel[ix+1]*=0.94;
      var par=layer===nearP?0.10:0.045;
      pos[ix]=hx+ox+vel[ix]+mouseNDC.x*par*hz*0.5;
      pos[ix+1]=hy+oy+vel[ix+1]-mouseNDC.y*par*hz*0.5;
      pos[ix+2]=hz;
    }
    layer.pts.geometry.attributes.position.needsUpdate=true;
  }
  var clock=new THREE.Clock();
  function loop(){
    requestAnimationFrame(loop);
    var dt=Math.min(clock.getDelta(),0.05);
    var now=performance.now();
    tweens.forEach(function(t){ if(t.running) t.step(now); });
    // 空闲缓慢自转（方向与阅读顺序一致：向右 → 下一面）
    var idle=false;
    if(!dragging&&!tourRunning&&!expanded&&now-lastInteract>8000){ yaw-=dt*0.10; idle=true; }
    applyRotation();
    if(idle) updateHud();
    updateParticles(farP,dt);
    updateParticles(nearP,dt);
    renderer.render(scene,camera);
  }

  /* ==================== 启动 ==================== */
  function resize(){
    var w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    if(!expanded){ camZ=defaultCamZ(); camera.position.z=camZ; }
  }
  window.addEventListener('resize',resize);
  updateHud();
  applyUI();
  loop();
  function whenReady(fn){ if(document.readyState==='complete') fn(); else window.addEventListener('load',fn); }
  whenReady(function(){
    setTimeout(function(){ document.getElementById('loader').classList.add('done'); },500);
    setTimeout(runTour,650);
  });
} /* end startApp */

/* ==================== Three.js CDN 加载（多源备选，按顺序尝试） ==================== */
var CDNS=[
  'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
];
function loadThree(i){
  if(window.THREE){ startApp(); return; }
  if(i>=CDNS.length){
    var fb=document.getElementById('fallback');
    fb.style.display='flex';
    document.getElementById('loader').classList.add('done');
    return;
  }
  var s=document.createElement('script');
  s.src=CDNS[i];
  s.onload=function(){ startApp(); };
  s.onerror=function(){ loadThree(i+1); };
  document.head.appendChild(s);
}
loadThree(0);
</script>
</body>
</html>
